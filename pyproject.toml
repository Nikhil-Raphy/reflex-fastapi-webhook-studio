[project]
name = "reflex-fastapi-webhook-studio"
version = "0.0.0"
description = "Catch, inspect and replay webhooks and HTTP requests."
readme = "README.md"
authors = [{ name = "Nikhil Raphy" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "reflex>=0.10.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "sqlmodel>=0.0.48",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reflex_fastapi_webhook_studio"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.0",
]
docs = [
    "zensical>=0.0.69",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "CPY"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["reflex_fastapi_webhook_studio"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
docstring-code-format = true

[tool.pylint.main]
py-version = "3.14"

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods", # Reflex state classes hold vars and handlers, not public methods.
]

[tool.pylint.format]
max-line-length = 120

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

# Reflex component packages ship no py.typed marker; read their real types instead of Any.
[[tool.mypy.overrides]]
module = [
    "reflex_components_code.*",
    "reflex_components_core.*",
    "reflex_components_dataeditor.*",
    "reflex_components_gridjs.*",
    "reflex_components_lucide.*",
    "reflex_components_markdown.*",
    "reflex_components_moment.*",
    "reflex_components_plotly.*",
    "reflex_components_radix.*",
    "reflex_components_react_player.*",
    "reflex_components_recharts.*",
    "reflex_components_sonner.*",
]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "e2e: browser tests with Playwright",
    "postgres: needs WEBHOOK_STUDIO_TEST_DATABASE_URL",
    "redis: needs WEBHOOK_STUDIO_TEST_REDIS_URL",
]

[tool.coverage.run]
branch = true
source = ["reflex_fastapi_webhook_studio"]

[tool.coverage.report]
fail_under = 90
show_missing = true
