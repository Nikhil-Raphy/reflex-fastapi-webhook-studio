name: Bug report
description: Tell us about something that does not work.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Say what you saw. Paste any error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
      placeholder: |
        1. Run `uv run reflex run`
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.14.6
