name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.24"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pylint --recursive=y reflex_fastapi_webhook_studio tests rxconfig.py alembic
      - run: uv run mypy .

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WEBHOOK_STUDIO_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/studio_test
      WEBHOOK_STUDIO_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest --cov

  ui-tests:
    name: ui-tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      APP_DIR: ../app
      POSTGRES_PASSWORD: ci-only-not-secret
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - name: Check out the browser tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nikhil-Raphy/playwright-e2e-tests-webhook-studio
          ref: main
          path: e2e-tests
          persist-credentials: false
      - name: Build the stack
        working-directory: e2e-tests
        run: docker compose build
      - name: Run the browser tests against this change
        working-directory: e2e-tests
        run: >-
          E2E_UID="$(id -u)" E2E_GID="$(id -g)"
          docker compose run --rm tests pytest tests/e2e --browser "$BROWSER" --reruns 1
          --junitxml="reports/junit-$BROWSER.xml"
      - name: Show the stack's logs
        if: failure()
        working-directory: e2e-tests
        run: docker compose logs app app-local echo
      - name: Keep traces, videos and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results-${{ matrix.browser }}
          path: e2e-tests/test-results/
          retention-days: 14
      - name: Stop the stack
        if: always()
        working-directory: e2e-tests
        run: docker compose down --volumes

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-only-not-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://localhost:17300
          curl --fail --silent "$base/api/v1/health" | grep '"redis":"ok"'
          bin_id=$(curl --fail --silent -X POST "$base/api/v1/bins" | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          curl --fail --silent -X POST "$base/api/webhook/$bin_id/smoke" -d 'hello'
          curl --fail --silent "$base/api/v1/bins/$bin_id/requests" | grep '"/smoke"'
          curl --fail --silent --output /dev/null "$base/bins/$bin_id"
          test "$(docker compose exec -T app id -u)" != "0"
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv export --locked --all-groups --all-extras --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit@2.10.1 -r requirements-audit.txt --require-hashes --disable-pip --progress-spinner off
      - run: >-
          uvx pip-audit@2.10.1 -r requirements-audit.txt --require-hashes --disable-pip --progress-spinner off
          --vulnerability-service osv
      - run: uv audit --locked
      - run: uvx zizmor@1.31.1 --offline .github/
